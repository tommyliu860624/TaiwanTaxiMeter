<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TTM</title>
  
  <!-- iOS 加入主畫面設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TTM">
  <link rel="apple-touch-icon" href="TTM.png">
  <link rel="icon" type="image/png" href="TTM.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: 科技感儀表字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- HTML2Canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #050608;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    
    /* 擬真 7段 LED / 車用儀表字體 */
    .font-meter {
      font-family: 'Chakra Petch', 'Share Tech Mono', monospace;
      letter-spacing: 1px;
    }
    
    /* 發光效果 */
    .glow-red { text-shadow: 0 0 12px rgba(239, 68, 68, 0.8), 0 0 24px rgba(239, 68, 68, 0.4); }
    .glow-green { text-shadow: 0 0 8px rgba(34, 197, 94, 0.8), 0 0 18px rgba(34, 197, 94, 0.35); }
    .glow-amber { text-shadow: 0 0 8px rgba(245, 158, 11, 0.8), 0 0 18px rgba(245, 158, 11, 0.35); }
    
    /* 深色車機面板 */
    .led-panel {
      background: radial-gradient(circle at center, #151720 0%, #08090d 100%);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.9), 0 2px 10px rgba(0,0,0,0.5);
    }

    /* 實體車機金屬消光黑外殼 */
    .meter-case {
      background: linear-gradient(180deg, #242427 0%, #151518 50%, #09090b 100%);
      border: 2px solid #38383e;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.12);
    }

    /* iPhone Safe Area 適配與動態島防護 */
    .safe-padding {
      padding-left: max(0.75rem, env(safe-area-inset-left));
      padding-right: max(0.75rem, env(safe-area-inset-right));
      padding-bottom: max(0.35rem, env(safe-area-inset-bottom));
      /* 動態島防護：垂直模式下額外增加間距 */
    }
    @media (orientation: portrait) {
      .safe-padding {
        padding-top: calc(max(0.35rem, env(safe-area-inset-top)) + 0.5rem);
      }
    }
    @media (orientation: landscape) {
      .safe-padding {
        padding-top: max(0.35rem, env(safe-area-inset-top));
      }
    }

    /* 收據熱感應紙質感與鋸齒 */
    .receipt-paper {
      background-color: #f8fafc;
      color: #0f172a;
      position: relative;
    }
    .receipt-paper::before, .receipt-paper::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: 8px;
      background-size: 16px 16px;
      z-index: 20;
    }
    .receipt-paper::before {
      top: -8px;
      background-image: linear-gradient(135deg, transparent 50%, #f8fafc 50%), linear-gradient(225deg, transparent 50%, #f8fafc 50%);
      background-position: left top;
    }
    .receipt-paper::after {
      bottom: -8px;
      background-image: linear-gradient(135deg, #f8fafc 50%, transparent 50%), linear-gradient(225deg, #f8fafc 50%, transparent 50%);
      background-position: left bottom;
    }
    /* 輸出模式隱藏鋸齒，避免 html2canvas 渲染跑版 */
    .export-mode::before, .export-mode::after {
      display: none !important;
    }

    /* 列印動畫 */
    #print-paper { transform: translateY(-100%); }
    .print-animate { transform: translateY(20px) !important; transition: transform 2.2s linear; }
  </style>
</head>
<body class="text-zinc-100 h-screen h-[100dvh] flex flex-col justify-between overflow-hidden safe-padding">

  <!-- 頂部極簡狀態列 -->
  <header class="w-full flex items-center justify-between py-1 text-xs text-zinc-400 flex-shrink-0">
    <div class="flex items-center gap-2">
      <span class="flex h-2 w-2 relative">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
      </span>
      <span class="font-bold tracking-wider text-amber-400 flex items-center gap-1 text-[11px] sm:text-xs">
        <i data-lucide="gauge" class="w-3.5 h-3.5 text-amber-400"></i>
        TAIWAN TAXI METER
      </span>
    </div>

    <div class="flex items-center space-x-1.5">
      <button id="btn-wake-lock" title="保持螢幕常亮" class="p-1.5 rounded-lg bg-zinc-800/80 text-zinc-400 hover:text-amber-400 transition-colors">
        <i data-lucide="sun" class="w-4 h-4"></i>
      </button>
      <button id="btn-sound-toggle" title="跳表嗶聲開關" class="p-1.5 rounded-lg bg-zinc-800/80 text-amber-400 hover:text-amber-300 transition-colors">
        <i data-lucide="volume-2" class="w-4 h-4" id="sound-icon"></i>
      </button>
      <div class="text-zinc-400 font-mono text-xs pl-1 font-bold" id="clock-display">00:00</div>
    </div>
  </header>

  <!-- 實體跳表機本體 (響應式支援橫向與直向) -->
  <main class="w-full flex-1 flex flex-col justify-center min-h-0 py-0.5">
    <div class="meter-case rounded-xl p-2 sm:p-2.5 flex flex-col justify-between h-full min-h-0">
      
      <!-- 經典指示燈列 -->
      <div class="flex justify-between items-center bg-zinc-950 px-3 py-1.5 rounded-lg border border-zinc-800/90 text-[11px] flex-shrink-0">
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1.5">
            <span id="lamp-empty" class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>
            <span class="font-bold text-emerald-400 tracking-wider text-[11px]" id="lamp-empty-txt">空車 VACANT</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span id="lamp-hired" class="w-2.5 h-2.5 rounded-full bg-zinc-700"></span>
            <span class="font-bold text-zinc-600 tracking-wider text-[11px]" id="lamp-hired-txt">營業 HIRED</span>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <span id="lamp-stopped" class="hidden text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-950 text-red-500 border border-red-900 animate-pulse">
            停止計費鎖定
          </span>
          <span id="lamp-tracking" class="text-[10px] font-medium px-2 py-0.5 rounded bg-zinc-900 text-zinc-500 border border-zinc-800 flex items-center gap-1">
            <i data-lucide="map-pin" class="w-2.5 h-2.5"></i>
            <span id="tracking-txt">GPS待命</span>
          </span>
        </div>
      </div>

      <!-- 中間核心數值顯示區 (支援橫/直轉換) -->
      <div class="flex flex-col portrait:flex-col landscape:flex-row gap-2 my-1.5 flex-1 min-h-0 items-stretch">
        
        <!-- 大字體主機 -->
        <div class="flex-1 landscape:w-7/12 led-panel rounded-lg p-3 border border-zinc-800 relative flex flex-col justify-between overflow-hidden">
          <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:14px_14px] pointer-events-none"></div>

          <div class="flex justify-between items-center relative z-10 border-b border-zinc-800/80 pb-1.5">
            <span class="text-[10px] sm:text-xs font-bold tracking-widest text-red-500/80 uppercase">車資 FARE (TWD)</span>
            
            <button id="btn-open-settings" class="flex items-center gap-1 bg-amber-500/10 px-2 py-1 rounded border border-amber-500/30 hover:opacity-80 transition-opacity">
              <i data-lucide="map" class="w-3 h-3 text-amber-500"></i>
              <span class="text-[11px] font-bold font-mono text-amber-400" id="current-region-display">北北基</span>
            </button>
          </div>

          <!-- 金額大字體 -->
          <div class="flex justify-end items-baseline font-meter my-auto relative z-10 portrait:py-4">
            <span class="text-2xl sm:text-3xl font-bold text-red-500/70 mr-2">NT$</span>
            <span class="text-7xl sm:text-7xl lg:text-8xl font-bold text-red-500 glow-red tracking-tight" id="display-fare">85</span>
          </div>

          <!-- 跳表進度條 -->
          <div class="relative z-10 pt-1">
            <div class="flex justify-between text-[11px] text-zinc-400 mb-1">
              <span>距下次跳表</span>
              <span id="jump-progress-label" class="font-mono text-amber-400 font-bold">1250m 或 60s</span>
            </div>
            <div class="w-full bg-zinc-900 rounded-full h-2 overflow-hidden border border-zinc-800">
              <div id="jump-progress-bar" class="bg-red-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- 儀表 (四格整合) -->
        <div class="landscape:w-5/12 grid grid-cols-2 portrait:grid-cols-2 gap-1.5 items-stretch">
          
          <div class="led-panel p-2 rounded-lg border border-zinc-800 flex flex-col justify-between">
            <div class="text-[10px] text-zinc-400 flex items-center justify-between">
              <span>總里程</span>
              <i data-lucide="navigation" class="w-3 h-3 text-amber-400"></i>
            </div>
            <div class="text-right">
              <div class="text-2xl sm:text-3xl font-bold font-meter text-amber-400 glow-amber leading-tight" id="display-distance">0.00</div>
              <div class="text-[10px] text-zinc-500 font-mono">km 公里</div>
            </div>
          </div>

          <div class="led-panel p-2 rounded-lg border border-zinc-800 flex flex-col justify-between">
            <div class="text-[10px] text-zinc-400 flex items-center justify-between">
              <span>時速</span>
              <i data-lucide="zap" class="w-3 h-3 text-emerald-400"></i>
            </div>
            <div class="text-right">
              <div class="text-2xl sm:text-3xl font-bold font-meter text-emerald-400 glow-green leading-tight" id="display-speed">0</div>
              <div class="text-[10px] text-zinc-500 font-mono">km/h</div>
            </div>
          </div>

          <div class="led-panel p-2 rounded-lg border border-zinc-800 flex flex-col justify-between">
            <div class="text-[10px] text-zinc-400 flex items-center justify-between">
              <span>低速停等</span>
              <i data-lucide="timer" class="w-3 h-3 text-amber-400"></i>
            </div>
            <div class="text-right">
              <div class="text-2xl sm:text-3xl font-bold font-meter text-amber-400 glow-amber leading-tight" id="display-idle-time">00:00</div>
              <div class="text-[10px] text-zinc-500 font-mono">累計</div>
            </div>
          </div>

          <div class="led-panel p-2 rounded-lg border border-zinc-800 flex flex-col justify-between">
            <div class="text-[10px] text-zinc-400 flex items-center justify-between">
              <span>GPS定位</span>
              <i data-lucide="satellite" class="w-3 h-3 text-zinc-400"></i>
            </div>
            <div class="text-right mt-auto">
              <div class="text-sm sm:text-base font-bold text-zinc-300" id="gps-badge">待命</div>
              <div class="text-[10px] text-zinc-500 font-mono truncate" id="gps-accuracy-text">未啟動</div>
            </div>
          </div>

        </div>
      </div>

      <!-- 底部鍵盤 -->
      <div class="grid grid-cols-4 landscape:grid-cols-12 gap-1.5 pt-1.5 border-t border-zinc-800/90 flex-shrink-0">
        
        <button id="btn-start-trip" class="col-span-1 landscape:col-span-3 flex flex-col sm:flex-row items-center justify-center gap-1 py-2 px-1 rounded-lg bg-gradient-to-r from-red-600 to-red-700 text-white font-bold text-[11px] sm:text-xs shadow-md shadow-red-950 active:scale-95 transition-all">
          <i id="btn-start-icon" data-lucide="play" class="w-4 h-4 fill-current"></i>
          <span id="btn-start-txt">起表開始</span>
        </button>

        <button id="btn-stop-trip" disabled class="col-span-1 landscape:col-span-3 flex flex-col sm:flex-row items-center justify-center gap-1 py-2 px-1 rounded-lg bg-zinc-800 text-zinc-500 font-bold text-[11px] sm:text-xs cursor-not-allowed transition-all">
          <i data-lucide="square" class="w-4 h-4"></i>
          <span>停止計費</span>
        </button>

        <button id="btn-print-receipt" disabled class="col-span-1 landscape:col-span-3 flex flex-col sm:flex-row items-center justify-center gap-1 py-2 px-1 rounded-lg bg-zinc-800 text-zinc-500 font-bold text-[11px] sm:text-xs cursor-not-allowed transition-all">
          <i data-lucide="printer" class="w-4 h-4"></i>
          <span>列印收據</span>
        </button>

        <!-- 附加費用切換 -->
        <div class="col-span-1 landscape:col-span-3 bg-zinc-950 border border-zinc-800 rounded-lg p-0.5 flex flex-col landscape:flex-row items-center gap-0.5 text-[10px] sm:text-[11px]">
          <button id="btn-toggle-night" class="flex-1 w-full py-1 px-0.5 text-center rounded bg-zinc-800 text-zinc-400 font-medium active:scale-95 transition-all border border-transparent">
            夜+$20
          </button>
          <button id="btn-toggle-toll" class="flex-1 w-full py-1 px-0.5 text-center rounded bg-zinc-800 text-zinc-400 font-medium active:scale-95 transition-all border border-transparent">
            道+$50
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 列印動畫遮罩 -->
  <div id="print-animation-overlay" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-[70] flex items-start justify-center pt-8 hidden pointer-events-none">
    <div id="print-paper" class="w-64 bg-white shadow-2xl receipt-paper flex flex-col items-center border border-zinc-200" style="height: 320px;">
      <div class="text-center pt-6 text-zinc-800/30 font-bold text-lg tracking-widest border-b-2 border-dashed border-zinc-300 pb-2 mx-4 w-full">TAIWAN TAXI</div>
      <div class="mt-4 w-full px-6 text-center text-zinc-400 text-xs font-bold">列印中...</div>
    </div>
  </div>

  <!-- 收據彈窗 (強制直式) -->
  <div id="modal-receipt" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[80] flex items-center justify-center p-4 hidden overflow-y-auto">
    <div class="bg-zinc-900 border border-zinc-800 w-full max-w-[360px] rounded-xl p-3 shadow-2xl my-auto flex flex-col max-h-[90dvh]">
      
      <div class="flex items-center justify-between border-b border-zinc-800 pb-2 mb-2 flex-shrink-0">
        <h3 class="font-bold text-[13px] text-white flex items-center gap-1"><i data-lucide="receipt" class="w-3.5 h-3.5 text-amber-400"></i>乘車證明</h3>
        <button id="btn-export-image" class="text-emerald-400 hover:text-emerald-300 flex items-center gap-1 text-[11px] bg-emerald-950/40 border border-emerald-800/50 px-2 py-1 rounded transition font-medium active:scale-95">
          <i data-lucide="share" class="w-3 h-3"></i> 分享圖片
        </button>
      </div>

      <!-- 直式收據本體 -->
      <div id="receipt-export-area" class="receipt-paper p-4 shadow-lg rounded border border-zinc-300 bg-white overflow-y-auto w-full">
        <div class="text-center font-bold text-[15px] border-b-2 border-dashed border-slate-300 pb-1.5 mb-2.5 text-slate-800 leading-tight">
          台灣計程車電子乘車證明單<br>
          <span class="text-[10px] text-slate-500 font-mono font-normal" id="receipt-print-time"></span>
        </div>
        
        <div class="flex flex-col gap-3 text-[11px] text-slate-700 font-mono">
          <div class="space-y-1">
            <div class="flex justify-between"><span>行駛總里程：</span><span class="font-bold text-slate-900" id="rcpt-distance">0.00 km</span></div>
            <div class="flex justify-between"><span>行車總時間：</span><span class="font-bold text-slate-900" id="rcpt-duration">00:00</span></div>
            <div class="flex justify-between"><span>低速停等：</span><span class="font-bold text-slate-900" id="rcpt-idle">00:00</span></div>
            <div class="flex justify-between pt-1"><span>基本跳表：</span><span class="font-bold text-slate-900" id="rcpt-base-fare">NT$ 85</span></div>
            <div id="rcpt-surcharge-list" class="space-y-0.5 pl-2 border-l-2 border-slate-300 ml-1 text-slate-600 text-[10px]"></div>
            
            <div class="border-t-2 border-dashed border-slate-300 pt-1.5 mt-1.5 flex justify-between items-baseline">
              <span class="font-bold text-slate-800 text-xs">應付總額：</span>
              <span class="font-bold text-2xl text-slate-900 tracking-tight">NT$ <span id="rcpt-total-fare">85</span></span>
            </div>
          </div>

          <div class="flex flex-col gap-1">
            <div class="text-center text-[10px] font-bold text-slate-500 tracking-widest">地圖軌跡</div>
            <div id="receipt-map-wrapper" class="receipt-map-wrapper rounded border border-slate-300 shadow-inner p-1 bg-white flex justify-center items-center w-full aspect-square">
              <!-- 1:1 Canvas -->
            </div>
          </div>
        </div>
      </div>

      <div class="pt-2 flex-shrink-0">
        <button id="btn-close-receipt" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 text-zinc-950 font-bold rounded-lg transition text-xs active:scale-95">
          完成交易 / 回復空車
        </button>
      </div>
    </div>
  </div>

  <!-- 費率選擇 Modal (九宮格全台費率) -->
  <div id="modal-settings" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[80] flex items-center justify-center p-3 hidden">
    <div class="bg-zinc-900 border border-zinc-800 w-full max-w-[320px] rounded-xl p-4 space-y-3 shadow-2xl">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
        <h3 class="font-bold text-sm text-white">地區費率設定 (支援自動校正)</h3>
        <button id="btn-close-settings" class="p-1 text-zinc-400 hover:text-white rounded"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="applyPreset('taipei', true)" class="p-2 text-[11px] rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 active:scale-95"><div class="font-bold text-amber-400">北北基</div></button>
        <button onclick="applyPreset('taoyuan', true)" class="p-2 text-[11px] rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 active:scale-95"><div class="font-bold text-amber-400">桃園市</div></button>
        <button onclick="applyPreset('hsinchu', true)" class="p-2 text-[11px] rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 active:scale-95"><div class="font-bold text-amber-400">竹苗區</div></button>
        <button onclick="applyPreset('taichung', true)" class="p-2 text-[11px] rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 active:scale-95"><div class="font-bold text-amber-400">中彰投</div></button>
        <button onclick="applyPreset('tainan', true)" class="p-2 text-[11px] rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 active:scale-95"><div class="font-bold text-amber-400">雲嘉南</div></button>
        <button onclick="applyPreset('kaohsiung', true)" class="p-2 text-[11px] rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 active:scale-95"><div class="font-bold text-amber-400">高屏區</div></button>
        <button onclick="applyPreset('yilan', true)" class="p-2 text-[11px] rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 active:scale-95"><div class="font-bold text-amber-400">宜蘭縣</div></button>
        <button onclick="applyPreset('hualien', true)" class="p-2 text-[11px] rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 active:scale-95"><div class="font-bold text-amber-400">花蓮縣</div></button>
        <button onclick="applyPreset('taitung', true)" class="p-2 text-[11px] rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 active:scale-95"><div class="font-bold text-amber-400">台東縣</div></button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-800/95 backdrop-blur border border-zinc-700 text-zinc-200 px-3 py-1.5 rounded-full text-xs font-medium shadow-lg pointer-events-none opacity-0 transition-opacity duration-300 z-[95] flex items-center gap-1.5 whitespace-nowrap">
    <i data-lucide="info" class="w-3.5 h-3.5 text-amber-400"></i>
    <span id="toast-text"></span>
  </div>

  <script>
    const safeGet = (id) => document.getElementById(id);

    class MeterAudioEngine {
      constructor() { this.ctx = null; this.enabled = true; }
      initContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playTripStart() { if(!this.enabled) return; this.initContext(); const now = this.ctx.currentTime; this.beep(880, now, 0.08); this.beep(1174, now + 0.1, 0.12); }
      playMeterTick() { if(!this.enabled) return; this.initContext(); this.beep(1046, this.ctx.currentTime, 0.06, 'sine'); }
      playTripStop() { if(!this.enabled) return; this.initContext(); this.beep(600, this.ctx.currentTime, 0.1, 'square'); this.beep(400, this.ctx.currentTime + 0.15, 0.15, 'square'); }
      playClick() { if(!this.enabled) return; this.initContext(); this.beep(2000, this.ctx.currentTime, 0.03, 'sine'); }
      playPrinterSound() {
        if(!this.enabled) return; this.initContext();
        for(let i=0; i<10; i++) { this.beep(150 + Math.random()*50, this.ctx.currentTime + (i*0.14), 0.09, 'sawtooth'); }
      }
      beep(freq, startTime, duration, type = 'sine') {
        try {
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
          osc.type = type; osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.2, startTime); gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(startTime); osc.stop(startTime + duration);
        } catch (e) {}
      }
    }
    const audioEngine = new MeterAudioEngine();

    function calcDist(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function getRegionByGps(lat, lng) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1500); // 1.5s JIT 超時防呆
        
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10&addressdetails=1`, {
          signal: controller.signal,
          headers: { 'Accept-Language': 'zh-TW' }
        });
        clearTimeout(timeoutId);
        const data = await res.json();
        return data.address.city || data.address.county || data.address.town || "";
      } catch (err) {
        return null; // 超時或無網路
      }
    }

      if (!cityStr) return null;
      if (cityStr.includes('台北') || cityStr.includes('新北') || cityStr.includes('基隆')) return 'taipei';
      if (cityStr.includes('桃園')) return 'taoyuan';
      if (cityStr.includes('新竹') || cityStr.includes('苗栗')) return 'hsinchu';
      if (cityStr.includes('台中') || cityStr.includes('彰化') || cityStr.includes('南投')) return 'taichung';
      if (cityStr.includes('雲林') || cityStr.includes('嘉義') || cityStr.includes('台南')) return 'tainan';
      if (cityStr.includes('高雄') || cityStr.includes('屏東')) return 'kaohsiung';
      if (cityStr.includes('宜蘭')) return 'yilan';
      if (cityStr.includes('花蓮')) return 'hualien';
      if (cityStr.includes('台東')) return 'taitung';
      return null;
    }

      const { latitude, longitude, speed, accuracy } = pos.coords;

      else { badge.textContent = "偏弱"; badge.className = "text-sm sm:text-base font-bold text-red-400"; }

      if (tripStatus === 'HIRED') {
        const now = Date.now();
        if (lastPosition) {
          const deltaDist = calcDist(lastPosition.lat, lastPosition.lon, latitude, longitude);
          const deltaTimeSec = (now - lastPosition.time) / 1000;
          const calcSpd = deltaTimeSec > 0 ? (deltaDist / deltaTimeSec) * 3.6 : 0;
          
          if (deltaDist >= 2.5 && calcSpd < 150) { // 抗飄移
            totalDistanceMeters += deltaDist;
            routeCoordinates.push({ lat: latitude, lng: longitude });
            safeGet('tracking-txt').textContent = `記錄中(${routeCoordinates.length})`;
          }
          currentSpeedKmh = (speed !== null && speed >= 0) ? Math.round(speed * 3.6) : Math.round(calcSpd);
        } else {
          routeCoordinates.push({ lat: latitude, lng: longitude });
        }
        lastPosition = { lat: latitude, lon: longitude, time: now };
        evaluateFare();
      } else if (tripStatus === 'PAUSED') {
        lastPosition = { lat: latitude, lon: longitude, time: Date.now() };
      }
    }

    function startGpsTracking() {
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(handleGpsSuccess, 
          () => { 
            safeGet('gps-accuracy-text').textContent = "未獲取訊號"; 
            safeGet('gps-badge').className = "text-zinc-500"; 
          }, 
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      }
    }

    function evaluateFare() {
      if (tripStatus !== 'HIRED') return;
      let newBaseFare = currentConfig.baseFare;
      if (totalDistanceMeters > currentConfig.baseDist) {
        newBaseFare += Math.floor((totalDistanceMeters - currentConfig.baseDist) / currentConfig.stepDist) * currentConfig.stepFare + currentConfig.stepFare;
      }
      newBaseFare += Math.floor(accumulatedIdleSeconds / currentConfig.idleSeconds) * currentConfig.stepFare;

      if (newBaseFare > baseCalculatedFare) {
        baseCalculatedFare = newBaseFare;
        audioEngine.playMeterTick(); 
      }
      totalFare = baseCalculatedFare + extraCharges;
      updateDisplay();
    }

    function onHeartbeat() {
      if (tripStatus === 'HIRED') {
        if (currentSpeedKmh <= currentConfig.idleSpeed) accumulatedIdleSeconds += 1;
        evaluateFare();
      }
      const d = new Date();
      safeGet('clock-display').textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function updateDisplay() {
      safeGet('display-fare').textContent = totalFare;
      safeGet('display-distance').textContent = (totalDistanceMeters / 1000).toFixed(2);
      safeGet('display-speed').textContent = tripStatus === 'STOPPED' ? 0 : currentSpeedKmh;
      
      const mins = Math.floor(accumulatedIdleSeconds / 60).toString().padStart(2, '0');
      const secs = (accumulatedIdleSeconds % 60).toString().padStart(2, '0');
      safeGet('display-idle-time').textContent = `${mins}:${secs}`;

      let distRemaining = currentConfig.baseDist - totalDistanceMeters;
      let isBase = true;
      if (totalDistanceMeters > currentConfig.baseDist) {
        distRemaining = currentConfig.stepDist - ((totalDistanceMeters - currentConfig.baseDist) % currentConfig.stepDist);
        isBase = false;
      }
      let idleRemaining = currentConfig.idleSeconds - (accumulatedIdleSeconds % currentConfig.idleSeconds);
      
      let distProgRaw = isBase ? (totalDistanceMeters / currentConfig.baseDist) : (((totalDistanceMeters - currentConfig.baseDist) % currentConfig.stepDist) / currentConfig.stepDist);
      let idleProgRaw = (accumulatedIdleSeconds % currentConfig.idleSeconds) / currentConfig.idleSeconds;
      let progress = Math.min(100, Math.round(Math.max(distProgRaw, idleProgRaw) * 100));
      
      safeGet('jump-progress-bar').style.width = `${progress}%`;
      if (tripStatus === 'HIRED' || tripStatus === 'PAUSED') {
        safeGet('jump-progress-label').textContent = `${Math.round(distRemaining)}m / ${Math.round(idleRemaining)}s`;
      } else {
        safeGet('jump-progress-label').textContent = `待命中`;
      }
    }

    async function renderReceiptMapCanvas() {
      const wrapper = safeGet('receipt-map-wrapper');
      // 動態抓取正方形容器寬度
      const size = wrapper.clientWidth - 8; 
      wrapper.innerHTML = `<canvas id="canvas-route-map" width="${size}" height="${size}" class="w-full h-full rounded"></canvas>`;
      const canvas = safeGet('canvas-route-map');
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (routeCoordinates.length === 0) {
        ctx.fillStyle = '#94a3b8'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
        ctx.fillText('無 GPS 軌跡', canvas.width / 2, canvas.height / 2); return;
      }

      let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
      routeCoordinates.forEach(pt => {
        if (pt.lat < minLat) minLat = pt.lat; if (pt.lat > maxLat) maxLat = pt.lat;
        if (pt.lng < minLng) minLng = pt.lng; if (pt.lng > maxLng) maxLng = pt.lng;
      });

      // 30% Bounding Box Padding 防出界
      const latDiff = Math.abs(maxLat - minLat); const lngDiff = Math.abs(maxLng - minLng);
      const latPad = (latDiff === 0 ? 0.005 : latDiff * 0.3);
      const lngPad = (lngDiff === 0 ? 0.005 : lngDiff * 0.3);
      minLat -= latPad; maxLat += latPad; minLng -= lngPad; maxLng += lngPad;

      const paddedLatDiff = Math.abs(maxLat - minLat);
      const maxDiff = Math.max(paddedLatDiff, Math.abs(maxLng - minLng));
      const centerLat = (minLat + maxLat) / 2; const centerLng = (minLng + maxLng) / 2;

      function lon2tile(lon, z) { return Math.floor((lon + 180) / 360 * Math.pow(2, z)); }
      function lat2tile(lat, z) { return Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z)); }
      function tile2lon(x, z) { return x / Math.pow(2, z) * 360 - 180; }
      function tile2lat(y, z) { const n = Math.PI - 2 * Math.PI * y / Math.pow(2, z); return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))); }

      let zoom = 16;
      if (maxDiff > 0.4) zoom = 10; else if (maxDiff > 0.2) zoom = 11;
      else if (maxDiff > 0.1) zoom = 12; else if (maxDiff > 0.05) zoom = 13;
      else if (maxDiff > 0.02) zoom = 14; else if (maxDiff > 0.008) zoom = 15;

      const centerTileX = lon2tile(centerLng, zoom);
      const centerTileY = lat2tile(centerLat, zoom);
      const tilePromises = [];

      // 載入 3x3 圖磚 (Google Maps 繁中無浮水印)
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const tx = centerTileX + dx, ty = centerTileY + dy;
          const p = new Promise(resolve => {
            const img = new Image(); img.crossOrigin = 'anonymous';
            img.src = `https://mt1.google.com/vt/lyrs=m&hl=zh-TW&x=${tx}&y=${ty}&z=${zoom}`;
            img.onload = () => resolve({ img, dx, dy, success: true });
            img.onerror = () => resolve({ dx, dy, success: false });
          });
          tilePromises.push(p);
        }
      }

      const loadedTiles = await Promise.all(tilePromises);
      const centerTileLon = tile2lon(centerTileX, zoom);
      const centerTileLat = tile2lat(centerTileY, zoom);
      const lonPerPixel = (tile2lon(centerTileX + 1, zoom) - centerTileLon) / 256;
      const latPerPixel = (centerTileLat - tile2lat(centerTileY + 1, zoom)) / 256;
      const originX = (canvas.width / 2) - ((centerLng - centerTileLon) / lonPerPixel);
      const originY = (canvas.height / 2) - ((centerTileLat - centerLat) / latPerPixel);

      loadedTiles.forEach(t => {
        if (t.success) ctx.drawImage(t.img, originX + (t.dx * 256), originY + (t.dy * 256), 256, 256);
      });

      // 畫軌跡
      ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      routeCoordinates.forEach((pt, i) => {
        const px = originX + ((pt.lng - centerTileLon) / lonPerPixel);
        const py = originY + ((centerTileLat - pt.lat) / latPerPixel);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();

      // 起終點標記
      const drawMarker = (pt, color) => {
        const px = originX + ((pt.lng - centerTileLon) / lonPerPixel);
        const py = originY + ((centerTileLat - pt.lat) / latPerPixel);
        ctx.fillStyle = color; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      };
      drawMarker(routeCoordinates[0], '#16a34a');
      drawMarker(routeCoordinates[routeCoordinates.length - 1], '#dc2626');
    }

    async function exportImage() {
      audioEngine.playClick();
      const node = safeGet('receipt-export-area');
      const btn = safeGet('btn-export-image');
      btn.innerHTML = '<i data-lucide="loader" class="w-3 h-3 animate-spin"></i> 處理中';
      btn.disabled = true;
      node.classList.add('export-mode'); // 隱藏鋸齒避免跑版
      
      try {
        const canvas = await html2canvas(node, { scale: 2, useCORS: true, backgroundColor: '#f8fafc' });
        node.classList.remove('export-mode');
        const fileName = `Taxi-Receipt-${Date.now()}.png`;

        canvas.toBlob(async (blob) => {
          if (!blob) throw new Error("轉換失敗");
          const file = new File([blob], fileName, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ title: '乘車證明單', text: `車資 NT$ ${totalFare}`, files: [file] });
              showToast("✅ 開啟系統分享");
            } catch (err) { if (err.name !== 'AbortError') triggerFileDownload(canvas, fileName); }
          } else {
            triggerFileDownload(canvas, fileName);
          }
          btn.innerHTML = '<i data-lucide="share" class="w-3 h-3"></i> 分享圖片'; btn.disabled = false; lucide.createIcons();
        }, 'image/png');

      } catch (err) {
        node.classList.remove('export-mode');
        btn.innerHTML = '<i data-lucide="share" class="w-3 h-3"></i> 分享圖片'; btn.disabled = false; lucide.createIcons();
        showToast("產生失敗: Google Map跨域限制"); // 若 Google 阻擋 CORS 會提示
      }
    }

    function triggerFileDownload(canvas, fileName) {
      const a = document.createElement('a'); a.href = canvas.toDataURL("image/png"); a.download = fileName; a.click();
      showToast("✅ 收據已下載");
    }

    function applyPreset(key, manual = false) {
      if (manual) audioEngine.playClick();
      if (!PRESETS[key]) return;
      currentConfig = { ...PRESETS[key] };
      safeGet('current-region-display').textContent = currentConfig.name;
      if (tripStatus === 'VACANT') {
        baseCalculatedFare = currentConfig.baseFare; totalFare = baseCalculatedFare + extraCharges; updateDisplay();
      }
      safeGet('modal-settings').classList.add('hidden');
      if (manual) showToast(`切換【${currentConfig.name}】費率`);
    }

    function showToast(text) {
      const toast = safeGet('toast'); safeGet('toast-text').textContent = text;
      toast.classList.remove('opacity-0'); toast.classList.add('opacity-100');
      setTimeout(() => { toast.classList.remove('opacity-100'); toast.classList.add('opacity-0'); }, 2500);
    }

    function resetToVacantState() {
      safeGet('modal-receipt').classList.add('hidden');
      tripStatus = 'VACANT';
      totalDistanceMeters = 0; accumulatedIdleSeconds = 0; routeCoordinates = [];
      baseCalculatedFare = currentConfig.baseFare; totalFare = baseCalculatedFare + extraCharges;
      
      safeGet('lamp-empty').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]";
      safeGet('lamp-empty-txt').className = "font-bold text-emerald-400 tracking-wider text-[11px]";
      safeGet('lamp-hired').className = "w-2.5 h-2.5 rounded-full bg-zinc-700";
      safeGet('lamp-hired-txt').className = "font-bold text-zinc-600 tracking-wider text-[11px]";
      safeGet('lamp-hired-txt').textContent = "營業 HIRED";
      safeGet('lamp-stopped').classList.add('hidden');
      safeGet('tracking-txt').textContent = "GPS待命";

      const btnStart = safeGet('btn-start-trip');
      btnStart.disabled = false;
      btnStart.innerHTML = `<i id="btn-start-icon" data-lucide="play" class="w-4 h-4 fill-current"></i><span id="btn-start-txt">起表開始</span>`;
      btnStart.className = "col-span-1 landscape:col-span-3 flex flex-col sm:flex-row items-center justify-center gap-1 py-2 px-1 rounded-lg bg-gradient-to-r from-red-600 to-red-700 text-white font-bold text-[11px] sm:text-xs shadow-md active:scale-95 transition-all";
      
      const btnPrint = safeGet('btn-print-receipt');
      btnPrint.className = "col-span-1 landscape:col-span-3 flex flex-col sm:flex-row items-center justify-center gap-1 py-2 px-1 rounded-lg bg-zinc-800 text-zinc-500 font-bold text-[11px] sm:text-xs cursor-not-allowed";
      btnPrint.disabled = true;

      lucide.createIcons(); updateDisplay();
    }

    async function toggleWakeLock() {
      audioEngine.playClick();
      if ('wakeLock' in navigator) {
        try {
          if (wakeLock !== null) { await wakeLock.release(); wakeLock = null; safeGet('btn-wake-lock').classList.remove('text-amber-400', 'bg-zinc-700'); showToast("螢幕常亮關閉"); } 
          else { wakeLock = await navigator.wakeLock.request('screen'); safeGet('btn-wake-lock').classList.add('text-amber-400', 'bg-zinc-700'); showToast("螢幕常亮開啟"); }
        } catch (err) { showToast("常亮設定失敗"); }
      }
    }
    async function requestWakeLock() {
      if ('wakeLock' in navigator && wakeLock === null) {
        try { wakeLock = await navigator.wakeLock.request('screen'); safeGet('btn-wake-lock').classList.add('text-amber-400', 'bg-zinc-700'); } catch (err) {}
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      setInterval(onHeartbeat, 1000);
      startGpsTracking();

      safeGet('btn-start-trip')?.addEventListener('click', actionStartTrip);
      safeGet('btn-stop-trip')?.addEventListener('click', actionStopTrip);
      safeGet('btn-print-receipt')?.addEventListener('click', actionPrintReceipt);
      
      safeGet('btn-toggle-night')?.addEventListener('click', () => {
        audioEngine.playClick(); isNightActive = !isNightActive;
        const delta = isNightActive ? currentConfig.nightSurcharge : -currentConfig.nightSurcharge;
        extraCharges += delta; totalFare += delta;
        const btn = safeGet('btn-toggle-night');
        if (isNightActive) { btn.classList.add('bg-amber-500/20', 'text-amber-400', 'border-amber-500/50'); btn.classList.remove('bg-zinc-800', 'text-zinc-400', 'border-transparent'); showToast("已加夜間加成"); } 
        else { btn.classList.remove('bg-amber-500/20', 'text-amber-400', 'border-amber-500/50'); btn.classList.add('bg-zinc-800', 'text-zinc-400', 'border-transparent'); showToast("已扣夜間加成"); }
        updateDisplay();
      });

      safeGet('btn-toggle-toll')?.addEventListener('click', () => {
        audioEngine.playClick(); isTollActive = !isTollActive;
        const delta = isTollActive ? 50 : -50; extraCharges += delta; totalFare += delta;
        const btn = safeGet('btn-toggle-toll');
        if (isTollActive) { btn.classList.add('bg-blue-500/20', 'text-blue-400', 'border-blue-500/50'); btn.classList.remove('bg-zinc-800', 'text-zinc-400', 'border-transparent'); showToast("已加國道費"); } 
        else { btn.classList.remove('bg-blue-500/20', 'text-blue-400', 'border-blue-500/50'); btn.classList.add('bg-zinc-800', 'text-zinc-400', 'border-transparent'); showToast("已扣國道費"); }
        updateDisplay();
      });

      safeGet('btn-wake-lock')?.addEventListener('click', toggleWakeLock);
      document.addEventListener('visibilitychange', async () => { if (wakeLock !== null && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); });
      safeGet('btn-close-receipt')?.addEventListener('click', () => { audioEngine.playClick(); resetToVacantState(); });
      safeGet('btn-export-image')?.addEventListener('click', exportImage);

      safeGet('btn-sound-toggle')?.addEventListener('click', () => {
        audioEngine.enabled = !audioEngine.enabled; audioEngine.initContext();
        safeGet('sound-icon').setAttribute('data-lucide', audioEngine.enabled ? 'volume-2' : 'volume-x');
        lucide.createIcons(); showToast(audioEngine.enabled ? "音效開啓" : "音效靜音"); audioEngine.playClick();
      });

      safeGet('btn-open-settings')?.addEventListener('click', () => { audioEngine.playClick(); safeGet('modal-settings').classList.remove('hidden'); });
      safeGet('btn-close-settings')?.addEventListener('click', () => { audioEngine.playClick(); safeGet('modal-settings').classList.add('hidden'); });

      updateDisplay();
    });
  </script>
</body>
</html>
